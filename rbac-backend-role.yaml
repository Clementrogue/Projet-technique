apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-read-cm-secrets
  namespace: cloudshop
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-read-cm-secrets-binding
  namespace: cloudshop
subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: cloudshop
roleRef:
  kind: Role
  name: backend-read-cm-secrets
  apiGroup: rbac.authorization.k8s.io
